name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site has a homepage
        run: test -f site/index.html
      - name: Block secret-looking files
        run: |
          if git ls-files | grep -E '(^|/)\.env' ; then
            echo "A .env file was committed. Remove it."; exit 1
          fi
