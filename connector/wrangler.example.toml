name = "rowland-whcc-sandbox-connector"
main = "src/worker.mjs"
compatibility_date = "2026-11-08"

[vars]
SHOPIFY_STORE = "rowland-photography-0v8ydig1.myshopify.com"
PUBLIC_BASE_URL = "https://replace-with-the-deployed-worker.example"
CONNECTOR_ENABLED = "false"
WHCC_SANDBOX_SUBMIT_ENABLED = "false"
WHCC_MAX_ORDER_TOTAL = "500"
ASSET_URL_TTL_SECONDS = "604800"

[[r2_buckets]]
binding = "ORIGINALS"
bucket_name = "rowland-photo-originals"

[[d1_databases]]
binding = "STATE"
database_name = "rowland-whcc-sandbox-state"
database_id = "replace-after-creating-d1"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

# Set these with `wrangler secret put`; never add their values to this file:
# SHOPIFY_CLIENT_ID
# SHOPIFY_CLIENT_SECRET
# WHCC_SANDBOX_API_KEY
# IMAGE_URL_SIGNING_SECRET
# WHCC_EVENT_SIGNING_SECRET
